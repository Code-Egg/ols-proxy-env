services:
  ols-proxy:
    build:
      context: .
      args:
        OLS_IMAGE: ${OLS_IMAGE:-litespeedtech/openlitespeed:latest}
    image: ols-proxy:local
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./lsws/conf:/usr/local/lsws/conf
      - ./logs:/usr/local/lsws/logs
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
