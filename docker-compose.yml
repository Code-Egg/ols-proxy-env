services:
  ols-proxy:
    build:
      context: .
      args:
        OLS_IMAGE: ${OLS_IMAGE:-litespeedtech/openlitespeed:latest}
    env_file:
      - .env
    environment:
      ACME_EMAIL: ${ACME_EMAIL-}
    ports:
      - "80:80"
      - "443:443"
      # Uncomment to expose the OpenLiteSpeed WebAdmin console.
      # - "7080:7080"
    volumes:
      - lsws_data:/usr/local/lsws
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - ls-net

volumes:
  lsws_data:

networks:
  ls-net:
    name: ls-net
